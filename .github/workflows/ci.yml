name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Build/lint/package checks run ONCE on a toolchain-supported Node: tsdown
  # 0.22+ (and its dts pipeline) requires Node ^22.18, while the PACKAGE
  # itself targets es2020 — what needs the matrix is the tests, not the build.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 11 needs Node >= 22.13 itself; the standalone binary bundles
          # its own runtime.
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm --filter @hwlt/era-connect typecheck
      - run: pnpm --filter @hwlt/era-connect build
      # Guard the exports map — a regression here breaks Metro/Node resolution silently.
      - run: pnpm exec publint
        working-directory: packages/connect
      - run: pnpm exec attw --pack .
        working-directory: packages/connect
      # The README tells integrators to copy files out of the demo, so it has
      # to keep compiling. The root scripts filter ./packages/*, which skips it.
      - run: pnpm --filter era-connect-expo-demo typecheck
      - name: Pack artifact for manual smoke installs
        run: pnpm pack --out era-connect.tgz
        working-directory: packages/connect
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: packages/connect/era-connect.tgz
          if-no-files-found: error

  # The package runs wherever its engines say — exercise the test suite on
  # every supported Node line.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hwlt/era-connect test

  nightly-fuzz:
    # Longer property-test runs; trigger manually (add `schedule:` once the
    # repository is active).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hwlt/era-connect test
        env:
          FC_NUM_RUNS: '10000'
