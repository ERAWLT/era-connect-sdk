name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC); provenance is automatic

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hwlt/era-connect build
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # The action does NOT shell-interpret this command (everything after
          # the binary is passed as argv — `&&` included), so the compound
          # publish-then-push-tags lives in a package.json script.
          publish: pnpm ci:publish
          title: 'Version packages'
        env:
          # A fine-grained PAT (contents + pull-requests: write): the org
          # policy does not let the default GITHUB_TOKEN create pull
          # requests, and PATs are exempt from that restriction.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: publishing uses npm trusted publishing (OIDC).
          # One-time setup: after the first (manual) publish of 0.1.0, register
          # this repository + workflow as a Trusted Publisher on npmjs.com for
          # @hwlt/era-connect, then revoke the bootstrap token.
